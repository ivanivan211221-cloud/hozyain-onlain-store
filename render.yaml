databases:
  - name: hozyan-db
    databaseName: hozyan
    user: hozyan

services:
  - type: web
    name: hozyan-api
    env: node
    rootDir: server
    buildCommand: npm install
    preDeployCommand: npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hozyan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hozyan-client.onrender.com

  - type: web
    name: hozyan-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hozyan-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
