services:
  - type: web
    name: hozyan-api
    env: node
    rootDir: server
    buildCommand: npm install
    preDeployCommand: npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: hozyan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_STORAGE
        value: /var/data/hozyan.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hozyan-client.onrender.com

  - type: web
    name: hozyan-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://hozyan-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
